<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title and page.url != "/" %}
<title>{{ page.title | strip_html }} | {{ site.title }}</title>
{%- else %}
<title>{{ site.title }} | {{ site.tagline }}</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
<meta name="theme-color" content="#12304f">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/mosaix.css' | relative_url }}">
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
{%- if page.redirect_to %}
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
<link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
{%- endif %}
</head>
<body>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
