# MOSAIX Lab website settings.
# GitHub reads this file when it builds the site. You rarely need to edit it.

title: MOSAIX Lab
long_name: "Multiscale mOdeling, Simulation & Integrated eXperimentation Lab"
tagline: "Atoms to airplanes."
description: >-
  The MOSAIX Lab at Saint Louis University designs and optimizes multifunctional
  composite materials across scales, from atoms to airplanes, using molecular
  dynamics, computational mechanics and experimental characterization.
email: pruthul.kokkada@slu.edu
department: "Department of Aerospace and Mechanical Engineering"
university: "Saint Louis University"
location: "St. Louis, Missouri"
url: "https://mosaix-lab.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

include:
  - _pages

exclude:
  - README.md
  - UPDATING.md
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-sitemap

defaults:
  # Every page uses the "page" layout unless it says otherwise.
  - scope:
      path: ""
    values:
      layout: page
  # The old sample blog posts from the template are hidden from the site.
  - scope:
      path: ""
      type: posts
    values:
      published: false
