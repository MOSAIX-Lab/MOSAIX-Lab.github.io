<section class="page-intro shell">
  {% if page.eyebrow %}<p class="eyebrow"><span class="dot"></span> {{ page.eyebrow }}</p>{% endif %}
  {% if page.heading %}<h1>{{ page.heading }}</h1>{% else %}<h1 class="sr-only">{{ page.title }}</h1>{% endif %}
  {% if page.intro %}<p class="intro-description">{{ page.intro }}</p>{% endif %}
</section>
